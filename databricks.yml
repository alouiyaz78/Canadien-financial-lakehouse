# Databricks Asset Bundle — deploys the whole lakehouse to a Databricks workspace:
#   * Unity Catalog schema + managed Volume (raw Bronze files)
#   * a daily serverless Job: 4 parallel ingestions → audit/freshness → change gate → Silver (MERGE) → Gold (ML + BI)
#
#   databricks bundle validate
#   databricks bundle deploy -t prod
#   databricks bundle run cfl_daily_refresh -t prod
#
# See docs/databricks.md for the one-time setup (CLI login, Census secret).

bundle:
  name: canadian-financial-lakehouse

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition workspaces have "workspace")
    default: workspace
  schema:
    description: Schema holding the Volume and all tables
    default: cfl
  warehouse_id:
    description: SQL warehouse that runs the AI/BI dashboard queries (SQL Warehouses → Connection details)
    default: 06f14f6523954c28

# Files synced to the workspace = everything not in .gitignore (data/ and .venv/ are ignored).
# Do not add "notebooks/**" to sync.exclude: gitignore-style patterns also match databricks/notebooks/.

resources:
  schemas:
    cfl:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "Canadian Financial Lakehouse — Bank of Canada, Statistics Canada, FRED and US Census data"

  volumes:
    lake:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.cfl.name}
      name: lake
      volume_type: MANAGED
      comment: "Raw API responses (Bronze) and ingestion manifests"

  # AI/BI dashboard (policy monitor + data operations). Generated by dashboards/build_dashboard.py.
  dashboards:
    cfl_dashboard:
      display_name: Canadian Financial Lakehouse
      file_path: ./dashboards/cfl_dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}

  jobs:
    cfl_daily_refresh:
      name: cfl-daily-refresh
      description: >-
        Poll Bank of Canada / StatCan / FRED / Census in parallel; store raw payloads only when they
        changed; publish the ingestion log and freshness report; rebuild Silver (MERGE) and Gold only
        if at least one series changed.
      max_concurrent_runs: 1
      schedule:
        # Daily polling: release dates vary, so the job checks every morning and only works when needed.
        quartz_cron_expression: "0 43 7 * * ?"
        timezone_id: America/Toronto
        pause_status: UNPAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.cfl.name}
        - name: run_id
          default: "{{job.run_id}}"
        - name: full_refresh
          default: "false"
      tasks:
        # 1. Bronze: one task per source, in parallel, each with its own retry.
        - task_key: ingest_valet
          notebook_task:
            notebook_path: ./databricks/notebooks/01_bronze_ingest.py
            base_parameters: {source: valet}
          max_retries: 1
          min_retry_interval_millis: 600000
        - task_key: ingest_statcan
          notebook_task:
            notebook_path: ./databricks/notebooks/01_bronze_ingest.py
            base_parameters: {source: statcan}
          max_retries: 1
          min_retry_interval_millis: 600000
        - task_key: ingest_fred
          notebook_task:
            notebook_path: ./databricks/notebooks/01_bronze_ingest.py
            base_parameters: {source: fred}
          max_retries: 1
          min_retry_interval_millis: 600000
        - task_key: ingest_census
          notebook_task:
            notebook_path: ./databricks/notebooks/01_bronze_ingest.py
            base_parameters: {source: census}
          max_retries: 1
          min_retry_interval_millis: 600000

        # 2. Audit: runs even if a source failed; ingestion log, freshness report, change flag.
        - task_key: audit_freshness
          run_if: ALL_DONE
          depends_on:
            - task_key: ingest_valet
            - task_key: ingest_statcan
            - task_key: ingest_fred
            - task_key: ingest_census
          notebook_task:
            notebook_path: ./databricks/notebooks/01b_audit_freshness.py

        # 3. Gate: skip Silver/Gold when nothing changed.
        - task_key: any_changes
          depends_on:
            - task_key: audit_freshness
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.audit_freshness.values.any_changed}}"
            right: "true"

        # 4. Silver (incremental MERGE), then the two Gold branches in parallel: ML table and Power BI marts.
        - task_key: silver_transform
          depends_on:
            - task_key: any_changes
              outcome: "true"
          notebook_task:
            notebook_path: ./databricks/notebooks/02_silver_transform.py
        - task_key: gold_model_table
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ./databricks/notebooks/03_gold_model_table.py
        - task_key: gold_bi_marts
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ./databricks/notebooks/04_gold_bi_marts.py

targets:
  # Personal sandbox: resources are prefixed with your user name and schedules are paused.
  dev:
    mode: development
    default: true

  # The "real" deployment shown in the portfolio: plain resource names, schedule active.
  prod:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
