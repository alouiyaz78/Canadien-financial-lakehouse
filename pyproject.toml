[project]
name = "canadian-financial-lakehouse"
version = "0.2.0"
description = "Medallion data pipeline (Bank of Canada Valet, Statistics Canada, FRED) and ML models forecasting Canadian core inflation and policy-rate decisions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyarrow>=21.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
cfl = "cfl.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "discovery"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
